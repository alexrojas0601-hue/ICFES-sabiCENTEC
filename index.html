<body>
<div id="offline" class="offline" hidden>Sin conexión: SABI sigue funcionando con el banco guardado en este equipo.</div>
<header class="top"><div class="in">
  <img class="face" src="assets/sabi-face.jpg" alt="" width="38" height="38">
  <div class="brand">SABI PREICFES CENTEC<small>Ruta del Error · Saber 11 · 9°, 10° y 11°</small></div>
  <div class="sp"></div>
  <button id="btnHome" type="button">Inicio</button>
  <button id="btnGuia" type="button">Guía ICFES</button>
  <button id="btnDocente" type="button">Docentes</button>
</div></header>
<main id="app"><section class="card center"><p class="muted">Cargando SABI…</p></section></main>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
/* ============ CONFIGURACIÓN ============ */
const MOTTO = "El error no nos detiene, nos enseña, nos fortalece y nos hace crecer.";
const KEY = "sabi_preicfes_v3";
const DOCENTE_CODE = "centec"; // candado de conveniencia para el panel docente en equipos compartidos (no es seguridad real)
const AREAS = {matematicas:"Matemáticas",lectura:"Lectura Crítica",sociales:"Sociales y Ciudadanas",ciencias:"Ciencias Naturales",ingles:"Inglés"};
const ORDER = ["matematicas","lectura","sociales","ciencias","ingles"];
const SHORT = {matematicas:"Matemáticas",lectura:"Lectura",sociales:"Sociales",ciencias:"Ciencias",ingles:"Inglés"};
/* Estructura real Saber 11 (número de preguntas por prueba) */
const REAL = {matematicas:50,lectura:41,sociales:50,ciencias:58,ingles:55};
const SIZES = {
  completo:{label:"Simulacro completo",desc:"254 preguntas, como el examen real (2 sesiones de 4 h 30 min).",f:1},
  medio:{label:"Simulacro medio",desc:"≈127 preguntas: la mitad del examen, misma proporción por prueba.",f:.5},
  express:{label:"Simulacro express",desc:"50 preguntas: 10 por prueba. Ideal para una clase.",fixed:10}
};
/* Rangos oficiales de niveles de desempeño Saber 11 (puntaje 0–100 por prueba) */
const NIVELES = {
  matematicas:[[35,1],[50,2],[70,3],[100,4]],
  lectura:[[35,1],[50,2],[65,3],[100,4]],
  sociales:[[40,1],[55,2],[70,3],[100,4]],
  ciencias:[[40,1],[55,2],[70,3],[100,4]],
  ingles:[[36,"A-"],[57,"A1"],[70,"A2"],[79,"B1"],[100,"B+"]]
};
const COMPS = {
  matematicas:["Interpretación y representación","Formulación y ejecución","Argumentación"],
  lectura:["Identificar y entender contenidos locales","Comprender cómo se articulan las partes de un texto","Reflexionar a partir de un texto y evaluar su contenido"],
  sociales:["Pensamiento social","Interpretación y análisis de perspectivas","Pensamiento reflexivo y sistémico"],
  ciencias:["Uso comprensivo del conocimiento científico","Explicación de fenómenos","Indagación"],
  ingles:["Lingüística","Pragmática","Sociolingüística"]
};
const W_NIVEL = {1:1,2:1.25,3:1.55,4:1.9}; // las preguntas más exigentes pesan más, como en la calificación por TRI del ICFES
const SR_DAYS = [1,3,7,15,30]; // repaso espaciado del Cuaderno de errores

/* ============ UTILIDADES ============ */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const shuffle = a => {for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const DAY = 864e5, today = () => Math.floor(Date.now()/DAY);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{students:{},cur:null}}catch(e){return{students:{},cur:null}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB,(k,v)=>k==="items"?undefined:v))}catch(e){toast("No se pudo guardar el progreso en este equipo (memoria llena).")}}
let DB = load();
const me = () => DB.cur && DB.students[DB.cur];
const fmtTime = ms => {const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")};
function nivelDe(area,p){for(const [lim,n] of NIVELES[area]) if(p<=lim) return n; return NIVELES[area].at(-1)[1]}
const nivelTxt = (area,n) => area==="ingles"?n:("Nivel "+n);
function globalScore(sc){ // fórmula ICFES: ponderación 3,3,3,3,1 sobre 13, escalada a 500
  if(ORDER.some(a=>sc[a]==null)) return null;
  return Math.round((3*(sc.matematicas+sc.lectura+sc.sociales+sc.ciencias)+sc.ingles)/13*5);
}

/* ============ BANCO (carga por grado, cacheado por el service worker) ============ */
const BANK = {}; let INDEX = null;
async function getIndex(){
  if(INDEX) return INDEX;
  try{INDEX = await (await fetch("banco/indice.json")).json()}catch(e){INDEX={grados:{}}}
  return INDEX;
}
async function getBank(g){
  if(BANK[g]) return BANK[g];
  const r = await fetch(`banco/${g}.json`); if(!r.ok) throw new Error("banco");
  BANK[g] = await r.json(); return BANK[g];
}

/* ============ SELECCIÓN SIN REPETIR, ADAPTATIVA Y POR TEXTO ============ */
function units(items){ // agrupa preguntas que comparten un mismo texto (como en el ICFES)
  const m=new Map();
  items.forEach(q=>{const k=q.grupo?q.area+"|"+q.grupo:q.id;if(!m.has(k))m.set(k,[]);m.get(k).push(q)});
  return [...m.values()];
}
function mastery(st,area){ // % de acierto reciente del estudiante en el área
  const h=(st.hist||[]).slice(-8); let t=0,o=0;
  h.forEach(x=>{const a=x.byArea&&x.byArea[area];if(a){t+=a.t;o+=a.o}});
  return t>=6?o/t:null;
}
function pick(st,g,bank,area,k,opts={}){
  st.seen=st.seen||{}; const key=g+"|"+area; let seen=new Set(st.seen[key]||[]); let cycle=false;
  let all=bank.filter(q=>q.area===area&&(!opts.comp||q.competencia===opts.comp));
  let pool=all.filter(q=>!seen.has(q.id));
  if(pool.length<Math.min(k,all.length)){cycle=true;all.forEach(q=>seen.delete(q.id));pool=all.slice()}
  // pesos por nivel: adaptativo en práctica, distribución tipo examen en simulacro
  const m=mastery(st,area);
  let wl={1:.2,2:.35,3:.3,4:.15};
  if(opts.adapt&&m!=null) wl = m<.45?{1:.4,2:.4,3:.15,4:.05}: m<.7?{1:.15,2:.35,3:.35,4:.15}:{1:.05,2:.2,3:.4,4:.35};
  if(opts.weak){ // prioriza la competencia más débil
    const w=weakComp(st,area); if(w){const p2=pool.filter(q=>q.competencia===w); if(p2.length>=k/2) pool=p2.concat(shuffle(pool.filter(q=>q.competencia!==w)).slice(0,Math.ceil(k/2)));}
  }
  const us=shuffle(units(pool)); const out=[]; const cnt={1:0,2:0,3:0,4:0};
  const want=l=>Math.max(1,Math.round(wl[l]*k));
  // primera pasada respetando la distribución, segunda llenando
  for(const pass of [0,1]){
    for(let i=0;i<us.length&&out.length<k;i++){
      const u=us[i]; if(!u) continue;
      const l=u[0].nivel;
      if(pass===0&&cnt[l]>=want(l)) continue;
      if(out.length+u.length>k&&out.length>0&&pass===1&&u.length>1) continue;
      u.forEach(q=>{out.push(q);cnt[q.nivel]++}); us[i]=null;
    }
  }
  out.splice(k);
  out.forEach(q=>seen.add(q.id)); st.seen[key]=[...seen];
  return {items:out,cycle};
}
function weakComp(st,area){
  const c={}; (st.hist||[]).slice(-10).forEach(h=>Object.entries(h.byComp||{}).forEach(([k,v])=>{if(v.area!==area)return;c[k]=c[k]||{t:0,o:0};c[k].t+=v.t;c[k].o+=v.o}));
  const arr=Object.entries(c).filter(([,v])=>v.t>=3).sort((a,b)=>a[1].o/a[1].t-b[1].o/b[1].t);
  return arr.length?arr[0][0]:null;
}

/* ============ RECURSOS VISUALES DEL ÍTEM ============ */
function renderTable(t){
  return `<div class="tbl"><table class="dtbl">${t.titulo?`<caption>${esc(t.titulo)}</caption>`:""}<thead><tr>${t.columnas.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${t.filas.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const COLORS=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
const fmtN = v => typeof v==="number"? (Math.abs(v)>=1000? v.toLocaleString("es-CO"): String(+v.toFixed(2)).replace(".",",")) : esc(v);
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function renderChart(g){
  const W=600,H=320,ml=62,mr=16,mt=34,mb=58, iw=W-ml-mr, ih=H-mt-mb;
  const title=g.titulo?`<text x="${W/2}" y="20" text-anchor="middle" font-weight="800" font-size="15">${esc(g.titulo)}</text>`:"";
  const series=g.series||[];
  if(g.tipo==="torta"){
    const d=series[0].datos, tot=d.reduce((s,p)=>s+p[1],0)||1; let a=-Math.PI/2; const cx=170,cy=175,r=120;
    const sl=d.map((p,i)=>{const a0=a,a1=a+p[1]/tot*2*Math.PI;a=a1;const large=a1-a0>Math.PI?1:0;
      const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      const mid=(a0+a1)/2, pct=Math.round(p[1]/tot*1000)/10;
      return `<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${COLORS[i%5]}" stroke="var(--surface)" stroke-width="2"/>`
      +(pct>=6?`<text x="${(cx+r*.62*Math.cos(mid)).toFixed(1)}" y="${(cy+r*.62*Math.sin(mid)).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" style="fill:#fff">${String(pct).replace(".",",")} %</text>`:"")});
    const leg=d.map((p,i)=>`<g transform="translate(330,${70+i*24})"><rect width="14" height="14" rx="3" fill="${COLORS[i%5]}"/><text x="22" y="12" font-size="13">${esc(p[0])}: ${fmtN(p[1])}</text></g>`).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.titulo||"Gráfica circular")}">${title}${sl.join("")}${leg}</svg>`;
  }
  const xsRaw=[]; series.forEach(s=>s.datos.forEach(p=>{if(!xsRaw.some(x=>x===p[0]))xsRaw.push(p[0])}));
  const numX = g.tipo!=="barras" && xsRaw.every(x=>typeof x==="number");
  const ys=series.flatMap(s=>s.datos.map(p=>p[1]));
  let ymin=Math.min(0,...ys), ymax=niceMax(Math.max(...ys,0)); if(ymin<0) ymin=-niceMax(-ymin);
  const Y=v=>mt+ih-(v-ymin)/(ymax-ymin)*ih;
  let X, xticks;
  if(numX){const xmin=Math.min(...xsRaw),xmax=Math.max(...xsRaw);const span=(xmax-xmin)||1;X=v=>ml+(v-xmin)/span*iw;xticks=xsRaw.slice().sort((a,b)=>a-b);if(xticks.length>12){const st=Math.ceil(xticks.length/10);xticks=xticks.filter((_,i)=>i%st===0)}}
  else{const n=xsRaw.length;const bw=iw/n;X=v=>ml+bw*(xsRaw.indexOf(v)+.5);xticks=xsRaw}
  let grid="",yl="";
  for(let i=0;i<=5;i++){const v=ymin+(ymax-ymin)*i/5,y=Y(v);grid+=`<line class="gr" x1="${ml}" x2="${W-mr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;yl+=`<text x="${ml-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="13">${fmtN(+v.toFixed(2))}</text>`}
  const rot = !numX && xticks.some(x=>String(x).length>6) && xticks.length>4;
  const xl=xticks.map(x=>`<text x="${X(x).toFixed(1)}" y="${H-mb+16}" text-anchor="${rot?"end":"middle"}" font-size="13" ${rot?`transform="rotate(-30 ${X(x).toFixed(1)} ${H-mb+16})"`:""}>${fmtN(x)}</text>`).join("");
  let marks="";
  if(g.tipo==="barras"){
    const n=xsRaw.length,bw=iw/n*.75,sw=bw/series.length;
    series.forEach((s,si)=>s.datos.forEach(p=>{const x=X(p[0])-bw/2+si*sw,y=Y(Math.max(p[1],0)),h=Math.abs(Y(p[1])-Y(0));
      marks+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(sw-2).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${COLORS[si%5]}"><title>${esc(s.nombre||"")} ${esc(p[0])}: ${fmtN(p[1])}</title></rect>`;
      if(series.length===1&&n<=12) marks+=`<text x="${(x+sw/2-1).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="700">${fmtN(p[1])}</text>`;}));
  } else {
    series.forEach((s,si)=>{const pts=s.datos.slice().sort((a,b)=>numX?a[0]-b[0]:xsRaw.indexOf(a[0])-xsRaw.indexOf(b[0]));
      if(g.tipo==="lineas") marks+=`<polyline fill="none" stroke="${COLORS[si%5]}" stroke-width="2.5" points="${pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"/>`;
      pts.forEach(p=>marks+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="4" fill="${COLORS[si%5]}"><title>${esc(s.nombre||"")} (${fmtN(p[0])}; ${fmtN(p[1])})</title></circle>`)});
  }
  const axes=`<line class="ax" x1="${ml}" x2="${W-mr}" y1="${Y(Math.max(0,ymin)).toFixed(1)}" y2="${Y(Math.max(0,ymin)).toFixed(1)}"/><line class="ax" x1="${ml}" x2="${ml}" y1="${mt}" y2="${mt+ih}"/>`;
  const labs=`<text x="${ml+iw/2}" y="${H-6}" text-anchor="middle" font-size="12" font-weight="700">${esc(g.ejeX||"")}</text><text transform="translate(14 ${mt+ih/2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="700">${esc(g.ejeY||"")}</text>`;
  const leg=series.length>1?`<div class="legend">${series.map((s,i)=>`<span><i style="background:${COLORS[i%5]}"></i>${esc(s.nombre)}</span>`).join("")}</div>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.titulo||"Gráfica")}">${title}${grid}${axes}${marks}${yl}${xl}${labs}</svg>${leg}`;
}
function cleanSvg(src){
  try{
    const doc=new DOMParser().parseFromString(src,"image/svg+xml"); const svg=doc.documentElement;
    if(svg.nodeName.toLowerCase()!=="svg") return "";
    svg.querySelectorAll("script,foreignObject,image,iframe").forEach(n=>n.remove());
    svg.querySelectorAll("*").forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^(javascript|http|\/\/)/i.test(a.value.trim())&&/href/i.test(a.name))n.removeAttribute(a.name)}));
    svg.setAttribute("role","img"); svg.removeAttribute("width"); svg.removeAttribute("height");
    return new XMLSerializer().serializeToString(svg);
  }catch(e){return ""}
}
function itemBody(q,showCtx=true){
  return `${showCtx&&q.contexto?`<div class="ctx">${esc(q.contexto)}</div>`:""}
  ${q.tabla?renderTable(q.tabla):""}

  <p class="stem">${esc(q.enunciado)}</p>`;
}
function metaBlock(q){

  ${q.mcer?`<div><b>Nivel MCER:</b> ${esc(q.mcer)}</div>`:""}</div></details>`;
}
/* Lectura en voz alta (funciona sin internet con las voces del dispositivo) */
function speak(text,lang){
  if(!("speechSynthesis" in window)){toast("Este dispositivo no tiene lectura en voz alta");return}
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=lang||"es-CO"; u.rate=.95;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith(u.lang.slice(0,2))); if(v)u.voice=v;
  speechSynthesis.speak(u);
}

    <div class="row between"><span class="eyebrow">${esc(S.titulo)} · Pregunta ${i+1} de ${n}</span><span class="small muted">${answered}/${n} respondidas${S.timer?` · <span class="timer" id="tm"></span>`:""}</span></div>
    <div class="prog" aria-hidden="true"><i style="width:${answered/n*100}%"></i></div>
    <div class="dots">${S.items.map((x,k)=>`<button type="button" data-go="${k}" class="${S.ans[x.id]?"ans":""} ${k===i?"cur":""} ${S.flag[x.id]?"flag":""}" aria-label="Ir a pregunta ${k+1}">${k+1}</button>`).join("")}</div>
  </section>
  <section class="card pop">
    <div class="chips"><span class="chip">${AREAS[q.area]}</span><span class="chip n${q.nivel}">Nivel ${q.nivel}</span><span class="chip">${esc(q.competencia)}</span>${q.mcer?`<span class="chip">${esc(q.componente)} · ${esc(q.mcer)}</span>`:""}</div>
    ${prevCtx?`<p class="small muted">Responde con base en el mismo texto de la pregunta anterior.</p>`:""}
    ${itemBody(q)}
    <div class="opts" role="radiogroup" aria-label="Opciones">${Object.entries(q.opciones).map(([L,t])=>`
      <label class="opt"><input type="radio" name="op" value="${L}" ${S.ans[q.id]===L?"checked":""}><span class="L">${L}</span><span>${esc(t)}</span></label>`).join("")}</div>
    <div class="row between">
      <label class="row small" style="font-weight:700;cursor:pointer"><input type="checkbox" id="flag" style="width:auto" ${S.flag[q.id]?"checked":""}> Tengo duda en esta pregunta</label>
      <button type="button" class="link" id="rd">🔊 Leer en voz alta</button>
    </div>
    ${q.estrategia_icfes&&S.tipo!=="sim"?`<details><summary>Pista: cómo pregunta el ICFES esto</summary><div class="meta"><span>${esc(q.estrategia_icfes)}</span></div></details>`:""}
    <div class="row between">
      <button type="button" id="prev" ${i===0?"disabled":""}>Anterior</button>
      ${i<n-1?`<button type="button" class="navy" id="next">Siguiente</button>`:`<button type="button" class="primary" id="finish">Entregar</button>`}
    </div>
    <div id="confirm"></div>
  </section>
  <div class="row"><button type="button" id="pause">Guardar y salir</button></div>`;
  const persistA=()=>{me().active=S;save()};
  app.querySelectorAll('input[name="op"]').forEach(r=>r.addEventListener("change",()=>{S.ans[q.id]=r.value;persistA();
    const a=Object.keys(S.ans).length;app.querySelector(".prog i").style.width=(a/n*100)+"%";app.querySelector(`[data-go="${i}"]`).classList.add("ans")}));
  $("#flag").onchange=e=>{S.flag[q.id]=e.target.checked;persistA();app.querySelector(`[data-go="${i}"]`).classList.toggle("flag",e.target.checked)};
  $("#rd").onclick=()=>speak([q.contexto,q.enunciado,...Object.entries(q.opciones).map(([L,t])=>L+". "+t)].filter(Boolean).join(". "),q.area==="ingles"?"en-US":"es-CO");
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;persistA();quiz()});
  $("#prev").onclick=()=>{S.i--;persistA();quiz()};
  $("#pause").onclick=()=>{persistA();clearInterval(tick);toast("Guardado. Continúa cuando quieras.");dash()};
  if($("#next"))$("#next").onclick=()=>{S.i++;persistA();quiz()};
  if($("#finish"))$("#finish").onclick=()=>{
    const miss=S.items.filter(x=>!S.ans[x.id]).length;
    if(!miss) return grade();
    $("#confirm").innerHTML=`<div class="box q"><b>Te faltan ${miss} pregunta(s) sin responder.</b><span>En el ICFES una pregunta en blanco cuenta como incorrecta: nunca dejes respuestas en blanco. ¿Entregar así?</span>
      <div class="row"><button type="button" id="cNo" class="navy">Volver a revisar</button><button type="button" id="cYes">Entregar de todos modos</button></div></div>`;
    $("#cNo").onclick=()=>{S.i=S.items.findIndex(x=>!S.ans[x.id]);quiz()};
    $("#cYes").onclick=grade;
  };
  if(S.timer){const upd=()=>{const el=$("#tm");if(!el)return clearInterval(tick);const used=Date.now()-S.start,budget=S.items.length*2*60e3;el.textContent="⏱ "+fmtTime(used)+" / "+fmtTime(budget);el.style.color=used>budget?"var(--bad)":""};upd();tick=setInterval(upd,1000)}
  window.scrollTo({top:0});
}

/* ============ CALIFICACIÓN ============ */
function scoreOf(items,ans){
  const by={}; items.forEach(q=>{const a=by[q.area]=by[q.area]||{w:0,o:0,t:0,c:0};const w=W_NIVEL[q.nivel]||1;a.w+=w;a.t++;if(ans[q.id]===q.correcta){a.o+=w;a.c++}});
  const sc={}; Object.entries(by).forEach(([a,v])=>sc[a]=Math.round(v.o/v.w*100)); return {sc,by};
}
function grade(){
  clearInterval(tick); const st=me(); S.end=Date.now();
  S.items.forEach(q=>{const ok=S.ans[q.id]===q.correcta;
    if(!ok) S.ruta[q.id]={kind:"error",state:"p"}; else if(S.flag[q.id]) S.ruta[q.id]={kind:"duda",state:"d"};
    st.cuaderno=st.cuaderno||{};
    if(!ok) st.cuaderno[q.id]={area:q.area,comp:q.competencia,elig:S.ans[q.id]||null,error:(q.errores[S.ans[q.id]]||{}).error||"En blanco",box:0,due:today()+1,conv:false,fecha:Date.now(),veces:((st.cuaderno[q.id]||{}).veces||0)+1};
  });
  persist(); st.active=S; save(); results();
}
function stats(){
  const n=S.items.length, ok=S.items.filter(q=>S.ans[q.id]===q.correcta).length;
  const by=key=>{const m={};S.items.forEach(q=>{const k=key(q);m[k]=m[k]||{t:0,o:0,area:q.area};m[k].t++;if(S.ans[q.id]===q.correcta)m[k].o++});return m};
  const {sc}=scoreOf(S.items,S.ans);
  const global = S.tipo==="sim"?globalScore(sc):null;
  return {n,ok,pct:Math.round(ok/n*100),sc,global,area:by(q=>q.area),comp:by(q=>q.competencia),niv:by(q=>"Nivel "+q.nivel)};
}
function bars(m,label=k=>k){return Object.entries(m).map(([k,v])=>`<div class="bar"><span>${esc(label(k))}</span><span class="t"><i style="width:${v.o/v.t*100}%"></i></span><b>${v.o}/${v.t}</b></div>`).join("")}
function rutaCounts(){const v=Object.values(S.ruta);return{err:v.filter(x=>x.kind==="error").length,conv:v.filter(x=>x.kind==="error"&&x.state==="f").length,dud:v.filter(x=>x.kind==="duda").length,dudOk:v.filter(x=>x.kind==="duda"&&x.state==="f").length}}
function results(){
  const st=stats(), rc=rutaCounts(), areas=Object.keys(st.sc);
  const head = st.global!=null
    ? `<div><div class="big">${st.global}</div><div class="muted small">de 500 · puntaje global estimado</div></div>`
    : `<div><div class="big">${st.sc[areas[0]]}</div><div class="muted small">de 100 · ${st.ok}/${st.n} correctas</div></div>`;
  app.innerHTML=`
  <section class="card score pop">${head}
    <div style="display:flex;flex-direction:column;gap:8px;min-width:0">
      <span class="eyebrow">${esc(me().name)} · ${esc(S.titulo)}</span>
      <h2>${st.global!=null?`${st.ok} de ${st.n} correctas en las 5 pruebas`:`${AREAS[areas[0]]}: ${nivelTxt(areas[0],nivelDe(areas[0],st.sc[areas[0]]))} de desempeño`}</h2>
      <p class="muted small">Estimación SABI con la fórmula del ICFES (Matemáticas, Lectura, Sociales y Ciencias ×3; Inglés ×1) y los rangos oficiales de niveles. Las preguntas difíciles pesan más. No reemplaza el resultado oficial.</p>
    </div>
  </section>
  ${areas.length>1?`<section class="card"><h3>Puntaje por prueba (0–100) y nivel de desempeño</h3><div class="kpis">${ORDER.filter(a=>st.sc[a]!=null).map(a=>`<div class="kpi"><span>${SHORT[a]}</span><b>${st.sc[a]}</b><span>${nivelTxt(a,nivelDe(a,st.sc[a]))}</span></div>`).join("")}</div></section>`:""}
  ${rc.err+rc.dud?`<section class="card hl">
    <span class="eyebrow">Tu siguiente paso</span>
    <h2>Tienes ${rc.err} error(es) y ${rc.dud} duda(s) listos para convertirse en aprendizaje.</h2>
    <p class="motto">“${MOTTO}”</p>
    <div class="row"><button class="primary" type="button" id="goRuta">Empezar mi Ruta del Error</button><button type="button" id="goDash">Más tarde</button></div>
    <p class="small muted">Tus errores quedan guardados en tu Cuaderno: SABI te los volverá a mostrar en 1, 3, 7 y 15 días para que no se repitan en el ICFES.</p>
  </section>`:`<section class="card"><h2>¡Todo correcto y sin dudas!</h2><p>Sube el reto: presenta un simulacro más largo o entrena la competencia de nivel 4.</p><div class="row"><button class="primary" id="goDash">Volver al inicio</button></div></section>`}
  <section class="card"><h3>Por competencia</h3><div class="bars">${bars(Object.fromEntries(Object.entries(st.comp).sort((a,b)=>ORDER.indexOf(a[1].area)-ORDER.indexOf(b[1].area)||COMPS[a[1].area].indexOf(a[0])-COMPS[b[1].area].indexOf(b[0]))),k=>k)}</div></section>
  <section class="card"><h3>Por nivel de exigencia de la pregunta</h3><div class="bars">${bars(Object.fromEntries(Object.entries(st.niv).sort()))}</div><p class="small muted">Nivel 1 = lo básico; nivel 4 = lo que logran los mejores puntajes. Para subir, asegura primero los niveles 2 y 3.</p></section>`;
  if($("#goRuta"))$("#goRuta").onclick=ruta;
  if($("#goDash"))$("#goDash").onclick=dash;
  window.scrollTo({top:0});
}

/* ============ RUTA DEL ERROR (4 pasos) ============ */
const STL={p:["p","Por resolver"],e:["e","En camino"],f:["f","Fortaleza"],d:["d","Duda por aclarar"]};
function ruta(){
  const rc=rutaCounts(), ids=Object.keys(S.ruta), total=rc.err+rc.dud, done=rc.conv+rc.dudOk, all=done===total&&total>0;
  app.innerHTML=`
  <section class="card">
    <span class="eyebrow">Ruta del Error · ${esc(me().name)}</span>
    <h2>${all?"¡Convertiste cada error en fortaleza!":"Elige un error y conviértelo en aprendizaje"}</h2>
    <div class="prog" aria-hidden="true"><i style="width:${total?done/total*100:0}%"></i></div>
    <p class="muted">${done} de ${total} convertidos en fortaleza. Cada uno tiene 4 pasos: entender el error, pensarlo tú, aprender y superar un reto gemelo.</p>
  </section>
  ${all?`<section class="card pop" style="border:2px solid var(--ok)">
    <div class="row" style="flex-wrap:nowrap"><img class="face" src="assets/sabi-face.jpg" alt="SABI" width="56" height="56"><h3>Cierre de tu ruta</h3></div>
    <p>Hoy demostraste nuestro lema: <b>“${MOTTO}”</b></p>
    <label class="f">¿Qué harás distinto en tu próximo simulacro?<textarea id="meta" rows="3" placeholder="Ej.: leer dos veces el enunciado y subrayar qué me piden antes de ver las opciones">${esc(S.meta||"")}</textarea></label>
    <div class="row"><button class="primary" id="saveMeta" type="button">Guardar mi compromiso</button><button type="button" id="again">Volver al inicio</button></div>
  </section>`:""}
  <section class="card"><div class="errlist">${ids.map(id=>{const q=S.items.find(x=>x.id===id),r=S.ruta[id],s=STL[r.state];
    return `<button type="button" class="erritem" data-id="${esc(id)}"><span class="chip">${SHORT[q.area]}</span><span style="min-width:0">${esc(q.enunciado.slice(0,95))}${q.enunciado.length>95?"…":""}<br><span class="muted small" style="font-weight:700">${r.kind==="error"?"Error: "+esc((q.errores[S.ans[q.id]]||{}).error||"Pregunta sin responder"):"Acertaste, pero dudaste"}</span></span><span class="st ${s[0]}">${s[1]}</span></button>`}).join("")}</div>
    <div class="row"><button type="button" id="back">Ver mis resultados</button><button type="button" id="home2">Inicio</button></div></section>`;
  app.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>step(b.dataset.id,1));
  $("#back").onclick=results; $("#home2").onclick=dash;
  if($("#saveMeta"))$("#saveMeta").onclick=()=>{S.meta=$("#meta").value.trim();persist();toast("Compromiso guardado")};
  if($("#again"))$("#again").onclick=dash;
  window.scrollTo({top:0});
}
function step(id,k,ctx){
  ctx=ctx||{q:S.items.find(x=>x.id===id),r:S.ruta[id],chosen:S.ans[id],back:ruta,save:()=>persist()};
  const {q,r,chosen}=ctx, e=q.errores[chosen];
  if(r.state==="p")r.state="e";
  const isDuda=r.kind==="duda";
  const titles=[isDuda?"Acertaste, pero dudaste":"Lo que tu error revela","Piénsalo tú primero","Aprende y resuelve tus dudas","Reto gemelo"];
  let body="";
  if(k===1){
    body=`${itemBody(q)}
    ${isDuda?`<div class="box ok"><b>Elegiste ${chosen}: ${esc(q.opciones[chosen])}. ¡Es correcta!</b><span>Marcaste que dudabas. Vamos a asegurar que la próxima vez respondas con certeza.</span></div>`
    : chosen?`<div class="box bad"><b>Elegiste ${chosen}: ${esc(q.opciones[chosen])}</b><span class="chip" style="align-self:flex-start">${esc(e.error)}</span><span>${esc(e.porque)}</span></div>`
    :`<div class="box bad"><b>Dejaste esta pregunta en blanco.</b><span>Un intento siempre enseña más que un vacío. Vamos a construirla juntos.</span></div>`}
    <p class="muted">Equivocarse aquí no es fallar: es encontrar exactamente qué ajustar antes del ICFES.</p>`;
  } else if(k===2){
    const guide=isDuda||!chosen?(Object.values(q.errores)[0]||{}).pregunta_guia:e.pregunta_guia;
    body=`<div class="box q"><span class="eyebrow">Pregunta guía</span><b class="pre">${esc(guide)}</b></div>
    <label class="f">Explícalo con tus palabras: ¿qué descubriste? (recuperación activa)<textarea id="refl" rows="3" placeholder="Me di cuenta de que…">${esc(r.refl||"")}</textarea></label>
    <p class="muted small">Tómate un minuto. Descubrirlo tú vale más que leer la respuesta.</p>`;
  } else if(k===3){
    body=`${(!isDuda&&chosen)?`<div class="box n"><span class="eyebrow">Corrige tu error</span><span>${esc(e.aprende)}</span></div>`:""}
    <div class="box ok"><b>La respuesta correcta es ${q.correcta}: ${esc(q.opciones[q.correcta])}</b><span class="pre">${esc(q.explicacion)}</span></div>
    <div class="tt"><div class="box q"><span class="eyebrow">Tip de SABI</span><span>${esc(q.tip)}</span></div><div class="box q"><span class="eyebrow">Truco</span><span>${esc(q.truco)}</span></div></div>
    <div class="box n"><span class="eyebrow">Así pregunta el ICFES</span><span>${esc(q.estrategia_icfes)}</span></div>
    <div class="chips">${(q.temas||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
    <h3>¿Te queda alguna duda?</h3>
    <div class="doubts">
      <button type="button" data-d="q">No entendí qué me preguntaban</button>
      <button type="button" data-d="o">Dudé entre dos opciones</button>
      <button type="button" data-d="t">No conozco un tema o palabra</button>
      <button type="button" data-d="w">¿Para qué me sirve esto?</button>
      <button type="button" data-d="ai">Preguntarle a SABI AI (con internet)</button>
      <button type="button" data-d="s">🔊 Escuchar la explicación</button>
    </div>
    <div id="dAns"></div>`;
  } else {
    const g=q.gemela, ga=r.gAns;
    body=`<p class="muted">Misma habilidad, otra situación. Demuéstrate que ya lo dominas.</p>
    ${g.contexto?`<div class="ctx">${esc(g.contexto)}</div>`:""}
    <p class="stem">${esc(g.enunciado)}</p>
    <div class="opts">${Object.entries(g.opciones).map(([L,t])=>`<label class="opt ${ga?(L===g.correcta?"is-ok":(L===ga?"is-bad":"")):""}"><input type="radio" name="gop" value="${L}" ${ga===L?"checked":""} ${r.state==="f"?"disabled":""}><span class="L">${L}</span><span>${esc(t)}</span></label>`).join("")}</div>
    <div id="gRes">${ga?gemelaMsg(q,ga):""}</div>`;
  }
  app.innerHTML=`
  <section class="card pop">
    <div class="row between"><span class="eyebrow">Paso ${k} de 4 · ${AREAS[q.area]}</span><span class="chip n${q.nivel}">Nivel ${q.nivel}</span></div>
    <div class="steps" aria-hidden="true">${[1,2,3,4].map(x=>`<span class="${x<=k?"on":""}"></span>`).join("")}</div>
    <h2>${titles[k-1]}</h2>
    ${body}
    ${k>1?metaBlock(q):""}
    <div class="row between">
      <button type="button" id="sBack">${k===1?"Volver":"Anterior"}</button>
      ${k<4?`<button type="button" class="navy" id="sNext">${k===2?"Ya lo pensé, quiero aprender":"Siguiente"}</button>`:`<button type="button" id="sRuta">Terminar</button>`}
    </div>
  </section>`;
  const saveRefl=()=>{const t=$("#refl");if(t){r.refl=t.value.trim();ctx.save()}};
  $("#sBack").onclick=()=>{saveRefl();k===1?ctx.back():step(id,k-1,ctx)};
  if($("#sNext"))$("#sNext").onclick=()=>{saveRefl();step(id,k+1,ctx)};
  if($("#sRuta"))$("#sRuta").onclick=ctx.back;
  if($("#retry"))$("#retry").onclick=()=>{r.gAns=null;ctx.save();step(id,4,ctx)};
  if($("#review"))$("#review").onclick=()=>step(id,3,ctx);
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>doubt(q,b.dataset.d,chosen));
  app.querySelectorAll('input[name="gop"]').forEach(x=>x.addEventListener("change",()=>{
    r.gAns=x.value; r.tries=(r.tries||0)+1;
    if(x.value===q.gemela.correcta){r.state="f";markConv(q.id);toast(r.kind==="error"?"¡Error convertido en fortaleza!":"¡Duda resuelta!")}
    ctx.save(); step(id,4,ctx);
  }));
  window.scrollTo({top:0});
}
function gemelaMsg(q,ga){
  const g=q.gemela;
  if(ga===g.correcta) return `<div class="box ok pop"><b>¡Correcto! Este error ya es una fortaleza.</b><span class="pre">${esc(g.explicacion)}</span><span>“${MOTTO}”</span></div>`;
  return `<div class="box bad"><b>Todavía no. Y está bien: cada intento te acerca.</b><span class="pre">${esc(g.explicacion)}</span>
  <div class="row"><button type="button" class="navy" id="review">Repasar la explicación</button><button type="button" id="retry">Intentar de nuevo</button></div></div>`;
}
function doubt(q,d,chosen){
  let h="";
  if(d==="q") h=`<div class="box n"><b>Volvamos a la pregunta, por partes.</b><span><b>Qué se evalúa:</b> ${esc(q.afirmacion)}</span><span><b>Qué debes hacer:</b> ${esc(q.evidencia)}</span><span><b>Método ICFES en 4 pasos:</b> 1) lee primero el enunciado para saber qué buscas; 2) vuelve al texto, tabla o gráfica y ubica solo esa información; 3) responde mentalmente antes de mirar las opciones; 4) descarta las opciones que contradicen el texto o los datos.</span></div>`;
  if(d==="o"){const rows=Object.keys(q.opciones).filter(L=>L!==q.correcta).map(L=>`<tr><td><b>${L}</b></td><td>${esc(q.opciones[L])}</td><td>${esc(q.errores[L].error)}: ${esc(q.errores[L].aprende)}</td></tr>`).join("");
    h=`<div class="box n"><b>Por qué cada opción incorrecta no funciona</b><div class="tbl"><table><thead><tr><th>Opción</th><th>Dice</th><th>Por qué no</th></tr></thead><tbody>${rows}</tbody></table></div><span>La correcta (${q.correcta}) es la única que cumple todo lo que pide la pregunta. En el ICFES, si dudas entre dos, busca la palabra del enunciado que una de ellas no cumple.</span></div>`}
  if(d==="t") h=`<div class="box n"><b>Temas para repasar</b><div class="chips">${(q.temas||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div><span><b>DBA:</b> ${esc(q.dba)}</span><span><b>Lineamiento:</b> ${esc(q.lineamiento)}</span><span>Repasa estos temas con tu docente o con SABI AI, y luego vuelve al reto gemelo.</span></div>`;
  if(d==="w") h=`<div class="box n"><b>Para qué te sirve</b><span>${esc(q.afirmacion)}</span><span>Esta competencia (${esc(q.competencia)}) pesa en tu puntaje de ${esc(AREAS[q.area])} en el Saber 11, y la usarás en la universidad, en el SENA y en decisiones reales: leer bien, calcular bien y argumentar bien.</span></div>`;
  if(d==="s"){speak([q.explicacion,q.tip].join(". "),"es-CO");return}
  if(d==="ai"){
    const txt=`Soy estudiante de ${me().grado}° en CENTEC y me preparo para el Saber 11. En esta pregunta de ${AREAS[q.area]} (${q.competencia}) elegí ${chosen||"nada"} y la correcta era ${q.correcta}.\n\nPregunta: ${q.contexto?q.contexto+"\n":""}${q.enunciado}\n${Object.entries(q.opciones).map(([L,t])=>L+") "+t).join("\n")}\n\nExplícame paso a paso por qué me equivoqué y dame otro ejemplo parecido para practicar.`;
    const go=()=>window.open("https://ai.sabicentec.com","_blank","noopener");
    if(!navigator.onLine){h=`<div class="box q">Necesitas internet para hablar con SABI AI. Mientras tanto, usa las otras ayudas.</div>`}
    else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>{toast("Pregunta copiada: pégala en SABI AI");go()},go);return}
    else{h=`<div class="box n"><span>Copia este texto y pégalo en SABI AI:</span><textarea rows="6" readonly>${esc(txt)}</textarea><button type="button" class="navy" id="aiGo">Abrir SABI AI</button></div>`}
  }
  $("#dAns").innerHTML=h; if($("#aiGo"))$("#aiGo").onclick=()=>window.open("https://ai.sabicentec.com","_blank","noopener");
}

/* ============ CUADERNO DE ERRORES Y REPASO ESPACIADO ============ */
function markConv(id){const st=me(),c=st.cuaderno&&st.cuaderno[id];if(c&&!c.conv){c.conv=true;c.box=Math.max(c.box,1);c.due=today()+SR_DAYS[1]}save()}
function dueList(st){return Object.entries(st.cuaderno||{}).filter(([,c])=>c.due<=today()&&c.box<SR_DAYS.length).map(([id])=>id)}
async function cuaderno(){
  const st=me(), bank=await getBank(st.grado), C=Object.entries(st.cuaderno||{});
  const byErr={}; C.forEach(([id,c])=>{byErr[c.error]=(byErr[c.error]||0)+1});
  const topErr=Object.entries(byErr).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const conv=C.filter(([,c])=>c.conv).length;
  app.innerHTML=`
  <section class="card"><span class="eyebrow">Mi Cuaderno de errores</span><h2>${C.length?`${C.length} errores registrados · ${conv} convertidos en fortaleza`:"Aún no tienes errores registrados"}</h2>
    <p class="motto">“${MOTTO}”</p>
    ${C.length?`<div class="prog"><i style="width:${conv/C.length*100}%"></i></div>`:""}
    <div class="row"><button class="primary" id="rep" ${dueList(st).length?"":"disabled"}>Repasar los de hoy (${dueList(st).length})</button><button id="bk">Volver</button></div></section>
  ${topErr.length?`<section class="card"><h3>Tus errores más frecuentes</h3><p class="small muted">Son tus patrones: si los corriges, tu puntaje sube en todas las pruebas.</p><div class="bars">${topErr.map(([e,n])=>`<div class="bar"><span>${esc(e)}</span><span class="t"><i style="width:${n/topErr[0][1]*100}%"></i></span><b>${n}</b></div>`).join("")}</div></section>`:""}
  ${C.length?`<section class="card"><h3>Todos mis errores</h3><div class="errlist">${C.sort((a,b)=>b[1].fecha-a[1].fecha).slice(0,80).map(([id,c])=>{const q=bank.find(x=>x.id===id);if(!q)return"";const s=c.conv?(c.box>=SR_DAYS.length?["f","Dominado"]:["f","Fortaleza"]):["p","Por convertir"];
    return `<button type="button" class="erritem" data-c="${esc(id)}"><span class="chip">${SHORT[c.area]}</span><span style="min-width:0">${esc(q.enunciado.slice(0,90))}…<br><span class="muted small" style="font-weight:700">${esc(c.error)} · repaso ${c.due<=today()?"hoy":"en "+(c.due-today())+" día(s)"}</span></span><span class="st ${s[0]}">${s[1]}</span></button>`}).join("")}</div></section>`:""}`;
  $("#bk").onclick=dash; if($("#rep"))$("#rep").onclick=repaso;
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const id=b.dataset.c,q=bank.find(x=>x.id===id),c=st.cuaderno[id];
    const r={kind:"error",state:c.conv?"f":"p"}; step(id,1,{q,r,chosen:c.elig,back:cuaderno,save:()=>{if(r.state==="f")markConv(id);save()}})});
}
async function repaso(){
  const st=me(), bank=await getBank(st.grado), ids=shuffle(dueList(st)).slice(0,10);
  if(!ids.length){toast("No tienes repasos pendientes hoy");return dash()}
  const items=ids.map(id=>bank.find(q=>q.id===id)).filter(Boolean);
  start({tipo:"repaso",titulo:"Repaso del Cuaderno de errores",items});
}
/* Al calificar un repaso: acierto => sube de caja (más días); error => vuelve a la caja 0 */
function srUpdate(st){
  if(S.tipo!=="repaso")return;
  S.items.forEach(q=>{const c=st.cuaderno[q.id];if(!c)return;
    if(S.ans[q.id]===q.correcta){c.box=Math.min(c.box+1,SR_DAYS.length);c.due=today()+(SR_DAYS[c.box]||60);c.conv=true}
    else{c.box=0;c.due=today()+1}});
}

/* ============ HISTORIAL Y PROGRESO ============ */
function persist(){
  const st=me(); if(!S||!S.end||!st) return;
  const s=stats(), rc=rutaCounts();
  const byComp={}; S.items.forEach(q=>{const k=q.competencia;byComp[k]=byComp[k]||{area:q.area,t:0,o:0};byComp[k].t++;if(S.ans[q.id]===q.correcta)byComp[k].o++});
  const byArea={}; Object.entries(s.area).forEach(([a,v])=>byArea[a]={t:v.t,o:v.o});
  const rec={sid:S.sid,tipo:S.tipo,titulo:S.titulo,fecha:new Date(S.start).toISOString(),dur:S.end-S.start,ok:s.ok,n:s.n,sc:s.sc,global:s.global,byArea,byComp,
    err:rc.err,conv:rc.conv,dud:rc.dud,meta:S.meta||"",
    fallos:S.items.filter(q=>S.ans[q.id]!==q.correcta).map(q=>({id:q.id,area:q.area,comp:q.competencia,elig:S.ans[q.id]||"—",error:(q.errores[S.ans[q.id]]||{}).error||"En blanco",conv:(S.ruta[q.id]||{}).state==="f"}))};
  st.hist=st.hist||[]; const i=st.hist.findIndex(h=>h.sid===rec.sid);
  if(i>=0) st.hist[i]=rec; else {st.hist.push(rec); srUpdate(st)}
  save();
}
function lineChart(points){ // evolución del puntaje global
  return renderChart({tipo:"lineas",titulo:"Evolución del puntaje global estimado",ejeX:"Simulacro",ejeY:"Puntaje (0–500)",series:[{nombre:"Global",datos:points}]});
}
async function progreso(){
  const st=me(), H=st.hist||[];
  const sims=H.filter(h=>h.global!=null);
  const agg={}; H.forEach(h=>Object.entries(h.byComp||{}).forEach(([k,v])=>{agg[k]=agg[k]||{area:v.area,t:0,o:0};agg[k].t+=v.t;agg[k].o+=v.o}));
  const areaAgg={}; H.slice(-10).forEach(h=>Object.entries(h.byArea||{}).forEach(([a,v])=>{areaAgg[a]=areaAgg[a]||{t:0,o:0};areaAgg[a].t+=v.t;areaAgg[a].o+=v.o}));
  const weak=Object.entries(agg).filter(([,v])=>v.t>=4).sort((a,b)=>a[1].o/a[1].t-b[1].o/b[1].t).slice(0,3);
  const lastSim=sims.at(-1);
  app.innerHTML=`
  <section class="card"><span class="eyebrow">Mi progreso · ${esc(st.name)}</span><h2>${H.length?`${H.length} entrenamientos · ${H.reduce((s,h)=>s+h.n,0)} preguntas respondidas`:"Aún no tienes entrenamientos"}</h2>
    ${lastSim?`<div class="kpis">${ORDER.map(a=>lastSim.sc[a]!=null?`<div class="kpi"><span>${SHORT[a]}</span><b>${lastSim.sc[a]}</b><span>${nivelTxt(a,nivelDe(a,lastSim.sc[a]))}</span></div>`:"").join("")}</div>`:""}
    <div class="row"><button id="bk">Volver</button></div></section>
  ${sims.length>=2?`<section class="card">${lineChart(sims.map((h,i)=>[i+1,h.global]))}<p class="small muted">Cada punto es un simulacro. La meta CENTEC: sumar al menos 15 puntos entre un simulacro y el siguiente.</p></section>`:""}
  ${Object.keys(areaAgg).length?`<section class="card"><h3>Acierto reciente por prueba (últimos 10 entrenamientos)</h3><div class="bars">${bars(areaAgg,a=>AREAS[a])}</div></section>`:""}
  ${weak.length?`<section class="card hl"><span class="eyebrow">Tu plan para subir puntaje</span><h3>Estas son las 3 competencias que más puntos te pueden dar:</h3>
    <ol>${weak.map(([k,v])=>`<li><b>${esc(k)}</b> (${AREAS[v.area]}): ${Math.round(v.o/v.t*100)} % de acierto. <button class="link" data-w="${esc(v.area+"|"+k)}">Entrenarla ahora</button></li>`).join("")}</ol>
    <p class="small muted">Rutina recomendada: 20 minutos diarios = 10 preguntas de tu competencia más débil + repaso del Cuaderno de errores. Un simulacro express cada semana.</p></section>`:""}
  ${H.length?`<section class="card"><h3>Historial</h3><div class="tbl"><table><thead><tr><th>Fecha</th><th>Entrenamiento</th><th>Correctas</th><th>Global</th><th>Errores convertidos</th></tr></thead><tbody>${H.slice().reverse().map(h=>`<tr><td>${h.fecha.slice(0,10)}</td><td>${esc(h.titulo)}</td><td>${h.ok}/${h.n}</td><td>${h.global??"—"}</td><td>${h.conv}/${h.err}</td></tr>`).join("")}</tbody></table></div></section>`:""}`;
  $("#bk").onclick=dash;
  app.querySelectorAll("[data-w]").forEach(b=>b.onclick=async()=>{const [a,c]=b.dataset.w.split("|");const bank=await getBank(st.grado);const r=pick(st,st.grado,bank,a,10,{comp:c,adapt:true});start({tipo:"comp",area:a,titulo:c,items:r.items})});
  window.scrollTo({top:0});
}

/* ============ GUÍA: CÓMO ES Y CÓMO PREGUNTA EL ICFES ============ */
function guia(){
  const comp={
    matematicas:[["Interpretación y representación","Leer y transformar información de tablas, gráficas, esquemas y textos: ¿qué dice el dato?"],["Formulación y ejecución","Plantear y resolver: elegir la operación, el modelo o la estrategia y ejecutarla bien."],["Argumentación","Validar o refutar afirmaciones y procedimientos: ¿por qué es cierto? ¿en qué paso hay un error?"]],
    lectura:[["Identificar y entender contenidos locales","Qué dice el texto: significado de palabras, expresiones y frases en su contexto."],["Comprender cómo se articulan las partes de un texto","Cómo está construido: relación entre párrafos, tesis y argumentos, voz que narra."],["Reflexionar a partir de un texto y evaluar su contenido","Qué tan válido es: supuestos, intención, fuerza de los argumentos, comparar textos."]],
    sociales:[["Pensamiento social","Usar conceptos de ciencias sociales y de la Constitución para entender situaciones."],["Interpretación y análisis de perspectivas","Reconocer actores, intereses, argumentos y prejuicios en un problema."],["Pensamiento reflexivo y sistémico","Ver las dimensiones (económica, política, ambiental, cultural) y los efectos de una decisión; evaluar fuentes."]],
    ciencias:[["Uso comprensivo del conocimiento científico","Usar conceptos de biología, química y física para resolver problemas."],["Explicación de fenómenos","Construir explicaciones causales y elegir el modelo que explica lo observado."],["Indagación","Preguntas investigables, variables, diseño experimental, interpretar datos y sacar conclusiones válidas."]],
    ingles:[["Partes 1–3","Avisos (dónde se ven), vocabulario y conversaciones: comunicación en situaciones reales."],["Partes 4 y 7","Gramática y léxico en textos con espacios."],["Partes 5–6","Comprensión literal e inferencial de textos."]]
  };
  app.innerHTML=`
  <section class="card"><span class="eyebrow">Guía ICFES de SABI</span><h2>Así es el examen Saber 11 y así se gana</h2>
  <p>El Saber 11 no mide cuánto memorizas, sino <b>qué haces con lo que sabes</b>. Cada pregunta está construida a partir de una <b>competencia</b> (lo que sabes hacer), una <b>afirmación</b> y una <b>evidencia</b> observable; las opciones incorrectas son errores típicos. Por eso SABI te muestra, en cada error, cuál fue tu razonamiento y cómo corregirlo.</p>
  <div class="row"><button id="bk">Volver</button></div></section>
  <section class="card"><h3>Estructura del examen</h3><div class="tbl"><table><thead><tr><th>Prueba</th><th>Preguntas</th><th>Peso en el global</th><th>Niveles</th></tr></thead><tbody>
    ${ORDER.map(a=>`<tr><td>${AREAS[a]}</td><td>${REAL[a]}</td><td>${a==="ingles"?"×1":"×3"}</td><td>${a==="ingles"?"A-, A1, A2, B1, B+":NIVELES[a].map(([l,n],i,arr)=>`${n}: ${i?arr[i-1][0]+1:0}–${l}`).join(" · ")}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="small"><b>Puntaje global (0–500)</b> = (3×Matemáticas + 3×Lectura + 3×Sociales + 3×Ciencias + 1×Inglés) ÷ 13 × 5. Cada prueba va de 0 a 100. Dos sesiones de 4 h 30 min: ≈ 2 minutos por pregunta.</p></section>
  ${ORDER.map(a=>`<section class="card"><h3>${AREAS[a]}: qué evalúa</h3><ul>${comp[a].map(([c,d])=>`<li><b>${c}.</b> ${d}</li>`).join("")}</ul></section>`).join("")}
  <section class="card hl"><h3>10 estrategias ICFES que suben puntaje</h3><ol>
    <li>Lee primero el enunciado: así sabes qué buscar en el texto, la tabla o la gráfica.</li>
    <li>Subraya el verbo y la condición clave (“NO”, “con respecto a”, “siempre”, “la mejor razón”).</li>
    <li>Responde mentalmente antes de mirar las opciones; luego busca la que coincide.</li>
    <li>Descarta: elimina las opciones que contradicen el texto, los datos o la pregunta.</li>
    <li>En gráficas, lee título, ejes, unidades y escala antes de los datos.</li>
    <li>En Lectura Crítica, la respuesta siempre está sustentada en el texto, no en tu opinión.</li>
    <li>En Sociales, identifica actores e intereses; desconfía de opciones extremas o que generalizan.</li>
    <li>En Ciencias, separa variable independiente, dependiente y controladas antes de concluir.</li>
    <li>Administra el tiempo: si una pregunta te toma más de 3 minutos, márcala y vuelve después.</li>
    <li>Nunca dejes respuestas en blanco: no hay penalización por responder mal.</li>
  </ol></section>
  <section class="card"><h3>La Ruta del Error CENTEC</h3><p>1) <b>Entiende</b> qué pensaste y por qué no funcionó. 2) <b>Piensa</b> con una pregunta guía antes de ver la solución. 3) <b>Aprende</b> la explicación paso a paso, el tip, el truco y cómo pregunta el ICFES. 4) <b>Demuéstralo</b> con un reto gemelo. Después, tu Cuaderno de errores te repasa en 1, 3, 7 y 15 días.</p><p class="motto">“${MOTTO}”</p></section>`;
  $("#bk").onclick=()=>me()?dash():login();
  window.scrollTo({top:0});
}

/* ============ PANEL DOCENTE ============ */
function docenteGate(){
  if(sessionStorage.getItem("sabi_doc")==="1") return docente();
  app.innerHTML=`<form class="card" id="f" style="max-width:420px;align-self:center;width:100%"><span class="eyebrow">Panel docente y directivo</span><h2>Ingreso</h2>
  <label class="f">Código institucional<input id="cd" type="password" autocomplete="off"></label><p id="e" class="small" style="color:var(--bad)" hidden>Código incorrecto.</p>
  <div class="row"><button class="primary" type="submit">Entrar</button><button type="button" id="bk">Volver</button></div></form>`;
  $("#bk").onclick=()=>me()?dash():login();
  $("#f").onsubmit=e=>{e.preventDefault();if(norm($("#cd").value)===DOCENTE_CODE){sessionStorage.setItem("sabi_doc","1");docente()}else $("#e").hidden=false};
}
function docente(filtro){
  const studs=Object.values(DB.students).filter(s=>!filtro||s.curso===filtro);
  const cursos=[...new Set(Object.values(DB.students).map(s=>s.curso).filter(Boolean))].sort();
  const freq={}, compAgg={}; let H=[];
  studs.forEach(s=>(s.hist||[]).forEach(h=>{H.push(Object.assign({name:s.name,grado:s.grado,curso:s.curso},h));
    h.fallos.forEach(f=>{const k=f.id+"|"+f.error;freq[k]=freq[k]||{id:f.id,area:f.area,error:f.error,n:0,c:0};freq[k].n++;if(f.conv)freq[k].c++});
    Object.entries(h.byComp||{}).forEach(([k,v])=>{compAgg[k]=compAgg[k]||{area:v.area,t:0,o:0};compAgg[k].t+=v.t;compAgg[k].o+=v.o})}));
  H.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const top=Object.values(freq).sort((a,b)=>b.n-a.n).slice(0,15);
  const sims=H.filter(h=>h.global!=null);
  const avg=sims.length?Math.round(sims.reduce((s,h)=>s+h.global,0)/sims.length):null;
  app.innerHTML=`
  <section class="card"><span class="eyebrow">Panel docente · datos de este dispositivo</span><h2>Seguimiento PREICFES</h2>
    <div class="row"><label class="f" style="min-width:180px">Curso<select id="cf"><option value="">Todos</option>${cursos.map(c=>`<option ${c===filtro?"selected":""}>${esc(c)}</option>`).join("")}</select></label></div>
    <div class="kpis"><div class="kpi"><span>Estudiantes</span><b>${studs.length}</b></div><div class="kpi"><span>Entrenamientos</span><b>${H.length}</b></div><div class="kpi"><span>Simulacros</span><b>${sims.length}</b></div><div class="kpi"><span>Global promedio</span><b>${avg??"—"}</b></div><div class="kpi"><span>Errores convertidos</span><b>${H.reduce((s,h)=>s+h.conv,0)}/${H.reduce((s,h)=>s+h.err,0)}</b></div></div>
    <p class="small muted">Cada equipo guarda sus propios datos. Para consolidar el colegio, exporta el CSV de cada equipo y únelos en la hoja del área.</p>
    <div class="row"><button class="navy" id="csv">Copiar / descargar CSV</button><button id="bk">Salir</button></div><textarea id="csvBox" rows="4" hidden readonly></textarea></section>
  ${Object.keys(compAgg).length?`<section class="card"><h3>Acierto por competencia (curso)</h3><p class="small muted">Las más bajas son la prioridad de planeación de clase.</p><div class="bars">${bars(Object.fromEntries(Object.entries(compAgg).sort((a,b)=>a[1].o/a[1].t-b[1].o/b[1].t)),k=>k+" · "+SHORT[compAgg[k].area])}</div></section>`:""}
  <section class="card"><h3>Errores conceptuales más frecuentes</h3>${top.length?`<div class="tbl"><table><thead><tr><th>Ítem</th><th>Prueba</th><th>Error</th><th>Veces</th><th>Convertidos</th></tr></thead><tbody>${top.map(t=>`<tr><td>${esc(t.id)}</td><td>${SHORT[t.area]}</td><td>${esc(t.error)}</td><td>${t.n}</td><td>${t.c}</td></tr>`).join("")}</tbody></table></div>`:`<p>Aún no hay datos en este dispositivo.</p>`}</section>
  ${H.length?`<section class="card"><h3>Entrenamientos (${H.length})</h3><div class="tbl"><table><thead><tr><th>Fecha</th><th>Estudiante</th><th>Curso</th><th>Tipo</th><th>Correctas</th><th>Global</th><th>Mat</th><th>Lec</th><th>Soc</th><th>Cie</th><th>Ing</th><th>Convertidos</th><th>Compromiso</th></tr></thead><tbody>${H.map(h=>`<tr><td>${h.fecha.slice(0,10)}</td><td>${esc(h.name)}</td><td>${esc(h.curso||h.grado+"°")}</td><td>${esc(h.titulo)}</td><td>${h.ok}/${h.n}</td><td>${h.global??"—"}</td>${ORDER.map(a=>`<td>${h.sc&&h.sc[a]!=null?h.sc[a]:"—"}</td>`).join("")}<td>${h.conv}/${h.err}</td><td>${esc(h.meta)}</td></tr>`).join("")}</tbody></table></div></section>`:""}`;
  $("#cf").onchange=e=>docente(e.target.value||undefined);
  $("#bk").onclick=()=>{sessionStorage.removeItem("sabi_doc");me()?dash():login()};
  $("#csv").onclick=()=>{
    const rows=[["fecha","estudiante","grado","curso","entrenamiento","correctas","total","global","matematicas","lectura","sociales","ciencias","ingles","errores","convertidos","dudas","item","prueba","competencia","opcion_elegida","error_conceptual","convertido"]];
    H.forEach(h=>(h.fallos.length?h.fallos:[{}]).forEach(f=>rows.push([h.fecha,h.name,h.grado,h.curso||"",h.titulo,h.ok,h.n,h.global??"",...ORDER.map(a=>h.sc&&h.sc[a]!=null?h.sc[a]:""),h.err,h.conv,h.dud,f.id||"",f.area||"",f.comp||"",f.elig||"",f.error||"",f.conv===undefined?"":f.conv?"sí":"no"])));
    const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`sabi_preicfes_${filtro||"todos"}_${new Date().toISOString().slice(0,10)}.csv`;a.click();toast("CSV descargado")}
    catch(e){const box=$("#csvBox");box.value=csv;box.hidden=false;box.select()}
  };
  window.scrollTo({top:0});
}
